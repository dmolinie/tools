[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = 'tools'
dynamic = ['version']   # Dynamic versioning from project
description = "Miscellaneous tools (files, text, Markdown, BibTeX, etc.)"
#long_description=long_description
#readme = 'README.md'
readme = {file = 'README.md', content-type = 'text/markdown'}
authors = [
    {name = "Dylan MOLINIE"},
    {email = "dylan.molinie@gmx.fr"}
]
license = 'GPL-3.0-or-later'
license-files = ['LICENSE.txt']
requires-python = '>= 3.8'
dependencies = []

[tool.setuptools.dynamic]
# Retrieve the 'version' from the project '__init__' file
version = {attr = 'tools.__version__'}

[project.optional-dependencies]
bibtex = ['bibtexparser']

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ['.']   # Current folder by default
include = ['*'] # All packages by default

